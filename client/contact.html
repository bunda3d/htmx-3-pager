<div
  class="card py-5 px-3 px-md-5 shadow-sm border-0 bg-white rounded-3 animate-fade-in"
>
  <h1 class="display-5 text-dark fw-bold mb-4">Get In Touch</h1>

  <div id="form-wrapper" class="mb-4 row">
    <form
      hx-post="api/backend.php?action=submit_lead"
      hx-target="#form-wrapper"
      hx-swap="outerHTML"
      class="needs-validation col-12 col-md-8 col-lg-6 me-md-auto"
    >
      <div class="mb-3">
        <label for="contact-name" class="form-label fw-semibold"
          >Your Name</label
        >
        <input
          id="contact-name"
          type="text"
          name="name"
          class="form-control"
          placeholder="Jane Doe"
          required
        />
      </div>

      <div class="mb-3">
        <label for="contact-email" class="form-label fw-semibold"
          >Email Address</label
        >
        <input
          type="email"
          id="contact-email"
          name="email"
          class="form-control"
          placeholder="jane@example.com"
          required
        />
      </div>

      <div class="mb-3">
        <label for="contact-message" class="form-label fw-semibold"
          >Message</label
        >
        <textarea
          id="contact-message"
          name="message"
          class="form-control"
          rows="4"
          placeholder="How can we help you?"
          required
        ></textarea>
      </div>

      <!-- Interactivity: Htmx updates this wrapper dynamically based on checkbox input -->
      <div class="mb-3 form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="salesCall"
          name="sales_call"
          value="1"
          hx-post="api/backend.php?action=toggle_phone"
          hx-target="#conditional-phone-container"
        />
        <label class="form-check-label fw-medium" for="salesCall"
          >I want a salesperson to call me</label
        >
      </div>

      <!-- Targeted container for the phone field injection -->
      <div id="conditional-phone-container" class="mb-4"></div>

      <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">
        Submit
      </button>
    </form>
  </div>
  <hr class="my-4" />

  <div class="d-flex justify-content-end">
    <button
      class="btn btn-primary btn-lg shadow-sm"
      hx-get="api/backend.php?action=page&amp;page=admin"
      hx-target="#main-content"
      hx-push-url="#admin"
    >
      Explore the Admin Dashboard Fragment &rarr;
    </button>
  </div>
</div>
