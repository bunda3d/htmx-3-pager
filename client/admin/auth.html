<div
  class="card py-5 px-3 px-md-5 shadow-sm border-0 bg-white rounded-3 animate-fade-in"
>
  <h1 class="h3">Admin demo sign-in</h1>

  <div class="row">
    <div class="col-12 col-md-8 col-lg-6 me-md-auto">
      <div class="px-3 py-2 my-3 border border-danger rounded">
        <p class="my-0">
          Demo login: <code>admin</code>
          <br />
          Demo password: <code>pw</code>
        </p>
      </div>

      <form
        hx-post="api/auth.php?action=login"
        hx-target="#auth-result"
        hx-swap="innerHTML"
      >
        <input type="hidden" name="csrf_token" value="<!-- CSRF_TOKEN -->" />

        <label class="form-label" for="username">Login</label>
        <input
          class="form-control mb-3"
          id="username"
          name="username"
          required
        />

        <label class="form-label" for="password">Password</label>
        <input
          class="form-control mb-3"
          id="password"
          name="password"
          type="password"
          required
        />

        <div class="d-flex justify-content-end">
          <button class="btn btn-primary btn-lg shadow-sm mt-2" type="submit">
            Sign in
          </button>
        </div>
      </form>
      <div id="auth-result" class="mt-4"></div>
    </div>
  </div>
</div>
